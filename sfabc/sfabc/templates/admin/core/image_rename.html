{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <title>Renommer l'image</title>
  <link rel="stylesheet" href="{% static 'css/admin.css' %}" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>

<body>
  <a href="{% url 'admin_core:admin_image_library' %}" class="logout-btn"><span
      class="material-symbols-outlined">arrow_back</span></a>

  <div class="container">
    <header>
      <h1>Renommer l'image</h1>
    </header>

    <form method="post" class="section-card">
      {% csrf_token %}

      <div class="form-section">
        <h2>
          <span class="material-symbols-outlined">image</span>
          Aperçu de l'image
        </h2>
        <div class="image-preview image-preview-centered">
          <img src="{{ image.image.url }}" alt="{{ image }}">
        </div>
      </div>

      <div class="form-section">
        <h2>
          <span class="material-symbols-outlined">edit</span>
          Renommer l'image
        </h2>
        <div class="form-group">
          <label class="form-label" for="id_new_name">Nouveau nom (sans extension)</label>
          <input type="text" name="new_name" id="id_new_name" class="form-control" value="" required>
        </div>
      </div>

      <div class="form-actions">
        <a href="{% url 'admin_core:admin_image_library' %}" class="btn-cancel">
          <span class="material-symbols-outlined">cancel</span>
          Annuler
        </a>
        <button type="submit" class="btn-submit">
          <span class="material-symbols-outlined">save</span>
          Renommer
        </button>
      </div>
    </form>
  </div>
</body>

</html>
