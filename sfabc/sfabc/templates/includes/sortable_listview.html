{% load i18n %}

<div class="sortable-links">
	{% if nom_produit %}
	<h2>{{ nom_produit }}</h2>
	{% endif %}
	<div class='sort-revs'>
		<p class="sortable-label">{% trans 'Trier par' %} : </p>
		{% for sort_link in sort_link_list %}
			<span class="sort-link {{ sort_link.attrs }}">
				<a class="btn sort-btn-box" href="{{ sort_link.path }}">
					<span class="{{ sort_link.indicator }} sort-btn">
							{{ sort_link.title }}
							{% if sort_link.indicator == 'sort-asc' %}▲{% endif %}
							{% if sort_link.indicator == 'sort-desc' %}▼{% endif %}
					</span>
				</a>
			</span>
		{% endfor %}
	</div>
</div>
