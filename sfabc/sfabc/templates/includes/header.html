{% block header %}
  <header>
  <nav class="navbar navbar-expand-lg navbar-dark border-bottom" 
       style="background-color: rgb(var(--bs-dark-rgb));">
    <div class="container-fluid">

      <!-- Search bar -->
      <form class="d-flex ms-auto me-3" role="search">
        <div class="input-group">
          <input class="form-control bg-body" type="search" placeholder="Rechercher..." aria-label="Search">
          <button class="btn btn-outline-light" type="submit">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </form>

      <!-- Links -->
      <ul class="navbar-nav mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="">À propos</a></li>
        <li class="nav-item"><a class="nav-link" href="">Contact</a></li>
      </ul>

      <!-- Hamburger button (toujours visible, icône blanche) -->
      <button class="btn ms-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu" aria-controls="offcanvasMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

    </div>
  </nav>
</header>

<!-- Offcanvas menu -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasMenu" aria-labelledby="offcanvasMenuLabel"
     style="background-color: var(--bs-body-bg); border-left: 5px solid rgb(var(--bs-dark-rgb));">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="offcanvasMenuLabel">Menu</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fermer"></button>
  </div>
  <div class="offcanvas-body">
    
    {% for menu, submenus in menus.items %}
      <div class="mb-2">
        <!-- Menu button with arrow -->
        <button class="btn w-100 d-flex justify-content-between align-items-center text-start" type="button"
                data-bs-toggle="collapse" data-bs-target="#collapse-{{ forloop.counter }}" aria-expanded="false">
          {{ menu }}
          <i class="bi bi-chevron-right"></i>
        </button>

        <!-- Submenus -->
        <div class="collapse mt-1" id="collapse-{{ forloop.counter }}">
          <ul class="list-group list-group-flush">
            {% for sub, url_name in submenus.items %}
              <li class="list-group-item">
                <a href="" class="text-decoration-none">{{ sub }}</a>
              </li>
            {% endfor %}
          </ul>
        </div>
      </div>
    {% endfor %}
    
  </div>
</div>

{% endblock %}
